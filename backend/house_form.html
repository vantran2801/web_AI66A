<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>House Price Prediction</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 420px;
        margin: 40px auto;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }
      input,
      select {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        cursor: pointer;
      }
      #result {
        margin-top: 20px;
        font-size: 18px;
      }
      #result.error {
        color: red;
      }
      #result.success {
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>House Price Prediction</h2>

    <form id="house-form">
      <label for="area">Area (m²)</label>
      <input type="number" id="area" name="area" min="0" step="0.1" required />

      <label for="location">Location</label>
      <select id="location" name="location">
        <option value="hanoi">hanoi</option>
        <option value="hcmc">hcmc</option>
        <option value="other">other</option>
      </select>

      <label for="bedrooms">Bedrooms</label>
      <input
        type="number"
        id="bedrooms"
        name="bedrooms"
        min="0"
        step="1"
        required
      />

      <button type="submit">Predict Price</button>
    </form>

    <div id="result"></div>

    <script>
      const form = document.getElementById("house-form");
      const resultEl = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const area = document.getElementById("area").value;
        const bedrooms = document.getElementById("bedrooms").value;
        const location = document.getElementById("location").value;

        resultEl.className = "";
        resultEl.textContent = "Calculating...";

        const url = `http://127.0.0.1:8000/predict?area=${encodeURIComponent(area)}&bedrooms=${encodeURIComponent(bedrooms)}&location=${encodeURIComponent(location)}`;

        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Server returned an error: ${response.status}`);
          }

          const data = await response.json();
          if (data.error) {
            resultEl.className = "error";
            resultEl.textContent = `Error: ${data.error}`;
          } else {
            resultEl.className = "success";
            resultEl.textContent = `Predicted Price: ${data.predicted_price.toLocaleString()} VND`;
          }
        } catch (error) {
          resultEl.className = "error";
          resultEl.textContent = `Error: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
